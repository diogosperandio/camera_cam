name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Criar release (rascunho)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          --repo "${{ github.repository }}"
          --title "EZ Share Viewer ${{ github.ref_name }}"
          --generate-notes
          --draft

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - run: flutter test
      - run: flutter build linux --release
      - name: Empacotar
        run: tar -czf ezshare_viewer-${{ github.ref_name }}-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - name: Anexar à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARQ="ezshare_viewer-${{ github.ref_name }}-linux-x64.tar.gz"
          sha256sum "$ARQ" > "$ARQ.sha256"
          gh release upload "${{ github.ref_name }}" "$ARQ" "$ARQ.sha256" --clobber

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Empacotar
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ezshare_viewer-${{ github.ref_name }}-windows-x64.zip
      - name: Anexar à release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "ezshare_viewer-${{ github.ref_name }}-windows-x64.zip"
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$h  $zip" | Out-File -Encoding ascii "$zip.sha256"
          gh release upload "${{ github.ref_name }}" "$zip" "$zip.sha256" --clobber

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
