name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair notas do CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md 2>/dev/null || true

      - name: Criar release (rascunho)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '[^[:space:]]' notes.md; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "EZ Share Viewer $GITHUB_REF_NAME" --notes-file notes.md --draft
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "EZ Share Viewer $GITHUB_REF_NAME" --generate-notes --draft
          fi

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - run: flutter test
      - run: flutter build linux --release
      - name: Empacotar
        run: tar -czf toshiba-flashair-wifi-viewer-${{ github.ref_name }}-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - name: Anexar à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARQ="toshiba-flashair-wifi-viewer-${{ github.ref_name }}-linux-x64.tar.gz"
          sha256sum "$ARQ" > "$ARQ.sha256"
          gh release upload "${{ github.ref_name }}" "$ARQ" "$ARQ.sha256" --clobber

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Empacotar
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath toshiba-flashair-wifi-viewer-${{ github.ref_name }}-windows-x64.zip
      - name: Anexar à release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "toshiba-flashair-wifi-viewer-${{ github.ref_name }}-windows-x64.zip"
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$h  $zip" | Out-File -Encoding ascii "$zip.sha256"
          gh release upload "${{ github.ref_name }}" "$zip" "$zip.sha256" --clobber

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
